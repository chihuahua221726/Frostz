<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frostz Games</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #101116;
        color: #f5f5f7;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100% - 40px, 1000px);
        margin: 0 auto;
        padding: 64px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      .intro {
        margin: 0 0 36px;
        color: #b7b8c2;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .game-search {
        width: 100%;
        margin: 0 0 28px;
        padding: 12px 14px;
        border: 1px solid #343640;
        border-radius: 8px;
        background: #1b1c23;
        color: #f5f5f7;
        font: inherit;
      }

      .game-library {
        margin-top: 48px;
      }

      .game-library h2 {
        margin-bottom: 8px;
      }

      #library-status {
        color: #b7b8c2;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 24px;
      }

      .game-card {
        padding: 0;
        overflow: hidden;
        border: 1px solid #343640;
        border-radius: 14px;
        background: #1b1c23;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: border-color 150ms ease, transform 150ms ease;
      }

      .game-card:hover,
      .game-card:focus-visible {
        transform: translateY(-3px);
        border-color: #9c8cff;
      }

      .game-photo {
        display: block;
        width: 100%;
        height: 190px;
        background: #272832;
        object-fit: cover;
      }

      .game-photo-contain {
        object-fit: contain;
      }

      .game-details {
        display: grid;
        gap: 8px;
        padding: 18px;
      }

      .game-details strong {
        font-size: 1.2rem;
      }

      .game-details span {
        color: #b7b8c2;
      }

      #player {
        position: fixed;
        inset: 0;
        display: none;
        background: #000;
      }

      #player.active {
        display: flex;
        flex-direction: column;
      }

      .player-toolbar {
        z-index: 1;
        display: flex;
        min-height: 52px;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        background: #191a20;
        color: #fff;
      }

      .player-toolbar button {
        padding: 8px 12px;
        border: 1px solid #555764;
        border-radius: 6px;
        background: #272832;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      #game-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #game-status {
        margin: 0 0 0 auto;
        color: #b7b8c2;
        font-size: 0.9rem;
      }

      #game-frame {
        width: 100%;
        height: 100%;
        flex: 1;
        border: 0;
      }

      @media (max-width: 600px) {
        main {
          padding: 40px 0;
        }

        .game-photo {
          min-height: 160px;
        }
      }
    </style>
  </head>
  <body>
    <main id="catalog">
      <h1>Frostz Games</h1>
      <p class="intro">Pick a game to play.</p>
      <label class="sr-only" for="game-search">Search games</label>
      <input
        class="game-search"
        id="game-search"
        type="search"
        placeholder="Search games..."
      />
      <section class="games" aria-label="Games">
        <button
          class="game-card"
          type="button"
          data-title="Boil Noodles at Night"
          data-src="Games/Boilnootiles.html"
        >
          <img
            class="game-photo"
            src="Games/assets/boil-noodles.png"
            alt="Boil Noodles at Night game title screen"
          />
          <span class="game-details">
            <strong>Boil Noodles at Night</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="Birthday Bash"
          data-src="Games/Birthdaybash.html"
        >
          <img
            class="game-photo"
            src="Games/assets/birthday-bash.png"
            alt="Birthday Bash game title screen"
          />
          <span class="game-details">
            <strong>Birthday Bash</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="Cheese Rolling"
          data-src="Games/Cheeserolling.html"
        >
          <img
            class="game-photo game-photo-contain"
            src="Games/assets/cheese-rolling.png"
            alt="Cheese Rolling game title screen"
          />
          <span class="game-details">
            <strong>Cheese Rolling</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="Beatblock"
          data-src="Games/Beatblock.html"
        >
          <img
            class="game-photo game-photo-contain"
            src="Games/assets/beatblock.png"
            alt="Beatblock game title screen"
          />
          <span class="game-details">
            <strong>Beatblock</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="Thirty Dollar Website"
          data-src="Games/30dollarwebsite.html"
        >
          <img
            class="game-photo"
            src="Games/assets/thirty-dollar-website.png"
            alt="Thirty Dollar Website game screen"
          />
          <span class="game-details">
            <strong>Thirty Dollar Website</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="Brotato"
          data-src="Games/Brotato.html"
        >
          <img
            class="game-photo"
            src="Games/assets/brotato.png"
            alt="Brotato game title screen"
          />
          <span class="game-details">
            <strong>Brotato</strong>
            <span>Click to play</span>
          </span>
        </button>
        <button
          class="game-card"
          type="button"
          data-title="InkWave"
          data-src="Games/InkWave.html"
        >
          <img
            class="game-photo"
            src="Games/assets/inkwave.png"
            alt="InkWave game title screen"
          />
          <span class="game-details">
            <strong>InkWave</strong>
            <span>Click to play</span>
          </span>
        </button>
      </section>
      <section class="game-library" aria-labelledby="library-title">
        <h2 id="library-title">More Games</h2>
        <p id="library-status" role="status" aria-live="polite">
          Loading games...
        </p>
        <div class="games" id="remote-games" aria-label="More games"></div>
      </section>
    </main>

    <section id="player" aria-label="Game player" aria-hidden="true">
      <div class="player-toolbar">
        <button id="back-button" type="button">Back to games</button>
        <strong id="game-title"></strong>
        <p id="game-status" role="status" aria-live="polite"></p>
      </div>
      <iframe id="game-frame" title="Game" allow="fullscreen"></iframe>
    </section>

    <script>
      const catalog = document.getElementById("catalog");
      const player = document.getElementById("player");
      let frame = document.getElementById("game-frame");
      const title = document.getElementById("game-title");
      const gameStatus = document.getElementById("game-status");
      const search = document.getElementById("game-search");
      const remoteGames = document.getElementById("remote-games");
      const libraryStatus = document.getElementById("library-status");
      let activeGameController = null;

      async function openGame(card) {
        if (activeGameController) {
          activeGameController.abort();
        }
        activeGameController = null;
        title.textContent = card.dataset.title;
        catalog.hidden = true;
        player.classList.add("active");
        player.setAttribute("aria-hidden", "false");

        const freshFrame = document.createElement("iframe");
        freshFrame.id = "game-frame";
        freshFrame.title = "Game";
        freshFrame.allow = "fullscreen; gamepad; autoplay; clipboard-read; clipboard-write";
        frame.replaceWith(freshFrame);
        frame = freshFrame;

        if (card.dataset.remote !== "true") {
          gameStatus.textContent = "";
          frame.src = card.dataset.src;
          return;
        }

        frame.sandbox.add(
          "allow-scripts",
          "allow-forms",
          "allow-pointer-lock",
          "allow-downloads",
          "allow-popups",
          "allow-popups-to-escape-sandbox",
          "allow-presentation",
        );
        gameStatus.textContent = "Loading game...";
        const controller = new AbortController();
        activeGameController = controller;
        const timeout = setTimeout(() => {
          controller.abort();
          if (activeGameController === controller) {
            activeGameController = null;
            gameStatus.textContent =
              "The game took too long to load. Check your connection and try again.";
          }
        }, 60000);

        try {
          const response = await fetch(card.dataset.src, {
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`Game request failed (${response.status})`);
          }
          const gameHtml = await response.text();
          if (controller.signal.aborted) {
            return;
          }

          const gameDocument = new DOMParser().parseFromString(
            gameHtml,
            "text/html",
          );
          if (!gameDocument.querySelector("base[href]")) {
            const base = gameDocument.createElement("base");
            base.href = new URL(".", card.dataset.src).href;
            gameDocument.head.prepend(base);
          }

          const gameBlobUrl = URL.createObjectURL(
            new Blob(
              [`<!doctype html>\n${gameDocument.documentElement.outerHTML}`],
              { type: "text/html" },
            ),
          );
          frame.addEventListener(
            "load",
            () => {
              URL.revokeObjectURL(gameBlobUrl);
              gameStatus.textContent = "";
            },
            { once: true },
          );
          frame.src = gameBlobUrl;
        } catch (error) {
          if (controller.signal.aborted) {
            return;
          }
          console.error(`Could not load ${card.dataset.title}:`, error);
          gameStatus.textContent =
            "The game could not be loaded. Check your connection and try again.";
        } finally {
          clearTimeout(timeout);
          if (activeGameController === controller) {
            activeGameController = null;
          }
        }
      }

      function filterGames() {
        const query = search.value.trim().toLocaleLowerCase();
        document.querySelectorAll(".game-card").forEach((card) => {
          card.hidden = !card.dataset.title.toLocaleLowerCase().includes(query);
        });
      }

      document.querySelectorAll(".game-card").forEach((card) => {
        card.addEventListener("click", () => {
          openGame(card);
        });
      });

      search.addEventListener("input", filterGames);

      async function loadMoreGames() {
        const zonesUrl =
          "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json";
        const htmlBase = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
        const coverBase = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";

        try {
          const response = await fetch(zonesUrl);
          if (!response.ok) {
            throw new Error(`Game list request failed (${response.status})`);
          }

          const zones = await response.json();
          if (!Array.isArray(zones)) {
            throw new Error("Game list response was not a list");
          }

          const games = zones.filter(
            (zone) =>
              zone &&
              typeof zone.name === "string" &&
              zone.name.trim() &&
              typeof zone.url === "string" &&
              zone.url.startsWith("{HTML_URL}/") &&
              typeof zone.cover === "string" &&
              zone.cover.startsWith("{COVER_URL}/"),
          );
          const fragment = document.createDocumentFragment();

          games.forEach((game) => {
            const gameUrl = new URL(game.url.replace("{HTML_URL}", htmlBase));
            const coverUrl = new URL(game.cover.replace("{COVER_URL}", coverBase));
            if (
              gameUrl.protocol !== "https:" ||
              coverUrl.protocol !== "https:" ||
              gameUrl.hostname !== "cdn.jsdelivr.net" ||
              coverUrl.hostname !== "cdn.jsdelivr.net"
            ) {
              return;
            }

            const card = document.createElement("button");
            card.className = "game-card";
            card.type = "button";
            card.dataset.title = game.name;
            card.dataset.src = gameUrl.href;
            card.dataset.remote = "true";
            card.addEventListener("click", () => openGame(card));

            const image = document.createElement("img");
            image.className = "game-photo";
            image.src = coverUrl.href;
            image.alt = `${game.name} cover`;
            image.loading = "lazy";
            image.decoding = "async";

            const details = document.createElement("span");
            details.className = "game-details";
            const gameName = document.createElement("strong");
            gameName.textContent = game.name;
            const action = document.createElement("span");
            action.textContent = "Click to play";
            details.append(gameName, action);
            card.append(image, details);
            fragment.append(card);
          });

          remoteGames.append(fragment);
          const loadedCount = remoteGames.childElementCount;
          libraryStatus.textContent = loadedCount
            ? `${loadedCount} more games loaded.`
            : "No additional games are available.";
          filterGames();
        } catch (error) {
          console.error("Could not load more games:", error);
          libraryStatus.textContent =
            "More games could not be loaded. Check your internet connection and refresh the page.";
        }
      }

      loadMoreGames();

      document.getElementById("back-button").addEventListener("click", () => {
        if (activeGameController) {
          activeGameController.abort();
        }
        activeGameController = null;
        frame.src = "about:blank";
        gameStatus.textContent = "";
        player.classList.remove("active");
        player.setAttribute("aria-hidden", "true");
        catalog.hidden = false;
      });
    </script>
  </body>
</html>

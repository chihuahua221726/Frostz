<!doctype html>
<html lang="en">

    <title>oneko neko</title>
    <style>
/* oneko neko — airy editorial type, ink, coral, and a tiny pixel companion. */
:root {
  --paper: #f8f9fb;
  --white: #fff;
  --ink: #242529;
  --muted: #62666d;
  --line: #dfe1e5;
  --coral: #cc3c24;
  --coral-hover: #b8321c;
  --peach: #f7e1d8;
  --mint: #e4eee8;
  --radius: 20px;
  --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 24px;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
}
button,
a,
summary {
  -webkit-tap-highlight-color: transparent;
}
button,
summary {
  cursor: pointer;
}
button {
  border: 0;
}
a:focus-visible,
button:focus-visible,
summary:focus-visible {
  outline: 3px solid #2369c0;
  outline-offset: 5px;
}
::selection {
  background: #f5c2b6;
  color: var(--ink);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  text-wrap: balance;
}
h1,
h2 {
  font-weight: 600;
  letter-spacing: -0.055em;
  line-height: 1.04;
}
em {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.06em;
}
p {
  color: var(--muted);
}
svg {
  flex-shrink: 0;
}
.icon {
  width: 21px;
  height: 21px;
  vertical-align: middle;
}
.wrap {
  width: min(1240px, calc(100% - 112px));
  margin-inline: auto;
}
.skip-link {
  position: fixed;
  z-index: 30;
  top: 12px;
  left: 12px;
  padding: 12px 20px;
  background: var(--ink);
  color: white;
  transform: translateY(-160%);
}
.skip-link:focus {
  transform: translateY(0);
}
.site-header {
  height: 105px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.wordmark {
  display: inline-flex;
  gap: 12px;
  align-items: center;
  font-size: 31px;
  font-weight: 750;
  letter-spacing: -1.7px;
  line-height: 1;
}
.wordmark-dot {
  color: var(--coral);
}

.wordmark > .sprite {
  margin-right: 2px;
}
.site-header nav {
  display: flex;
  align-items: center;
  gap: 35px;
  font-size: 14px;
  font-weight: 550;
}
.site-header nav > a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  transition: color 0.15s;
}
.site-header nav > a:hover {
  color: var(--coral);
}
.site-header .nav-cta {
  padding: 10px 17px;
  border: 1px solid var(--ink);
  border-radius: 7px;
  gap: 21px;
}
.hero {
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  gap: 58px;
  align-items: center;
  padding-block: 83px 77px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1.6px;
  color: var(--muted);
  line-height: 1.7;
}
.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--coral);
  border-radius: 50%;
  margin-right: 8px;
}
.hero h1 {
  font-size: clamp(64px, 6.4vw, 93px);
  margin: 23px 0 25px;
}
.hero h1 em {
  color: var(--coral);
}
.hero-description {
  max-width: 382px;
  font-size: 16px;
  line-height: 1.8;
}
.hero-actions {
  display: flex;
  align-items: center;
  gap: 23px;
  flex-wrap: wrap;
  margin-top: 31px;
}
.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  min-height: 52px;
  padding: 14px 21px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.4;
  transition:
    background 0.18s,
    box-shadow 0.18s;
  cursor: pointer;
}
.button.primary {
  color: white;
  background: var(--coral);
  box-shadow: 0 2px 0 #a9362230;
}
.button.primary:hover {
  background: var(--coral-hover);
  box-shadow: 0 4px 12px #bf3d2428;
}
.button > .icon:last-child {
  width: 17px;
}
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  min-height: 44px;
  font-weight: 600;
}
.text-link:hover {
  text-decoration: underline;
  text-underline-offset: 5px;
}
.microcopy {
  font-size: 11px;
  margin-top: 14px;
  color: var(--muted);
}
.hero-play {
  min-width: 0;
  position: relative;
  padding-top: 40px;
}
.play-note {
  position: absolute;
  top: -7px;
  left: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #6b6762;
  font: italic 16px var(--serif);
  transform: rotate(-3deg);
}
.play-note svg {
  width: 57px;
  height: 40px;
  transform: translateY(18px);
}
.desktop {
  border: 1px solid #d9d8d8;
  border-radius: 14px;
  background: white;
  box-shadow:
    0 28px 50px -24px #4b443938,
    0 4px 9px #28241e08;
  overflow: hidden;
}
.desktop-bar {
  height: 39px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  font-size: 10px;
  color: #707178;
  border-bottom: 1px solid #e4d9d2;
  letter-spacing: 0.2px;
  background: #fcfbfa;
}
.window-dots {
  display: flex;
  gap: 5px;
}
.window-dots i {
  width: 7px;
  height: 7px;
  border: 1px solid #c5c4c2;
  border-radius: 50%;
  background: #e5e4e1;
}
.desktop-mark {
  width: 32px;
  text-align: right;
}
.desktop-scene {
  height: 414px;
  background: #f2dfd6;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  touch-action: pan-y;
}
.desktop-scene::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 550px;
  height: 550px;
  border-radius: 50%;
  top: 150px;
  left: 50%;
  background: #e5b4a2;
  transform: translateX(-50%);
}
.desktop-scene::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  top: 250px;
  left: 50%;
  background: #d58e79;
  transform: translateX(-50%);
}
.wallpaper-word {
  position: absolute;
  left: 30px;
  top: 30px;
  font-size: 43px;
  color: #8e5746;
  line-height: 1.1;
  letter-spacing: -2px;
  font-weight: 550;
  user-select: none;
}
.wallpaper-word em {
  color: #8e5746;
}
.desktop-folder {
  position: absolute;
  right: 19px;
  top: 31px;
  text-align: center;
  display: grid;
  justify-items: center;
  gap: 2px;
  font-size: 8px;
  color: #6f5347;
  user-select: none;
}
.desktop-folder svg {
  width: 38px;
  height: 38px;
  fill: #f7eee6;
  stroke: #a8856d;
  stroke-width: 1;
}
.sticky-note {
  position: absolute;
  top: 159px;
  left: 35px;
  transform: rotate(-6deg);
  background: #fffaf0;
  box-shadow: 1px 8px 12px #795b4a17;
  padding: 20px 21px;
  width: 231px;
  display: grid;
  gap: 11px;
  font-size: 11px;
  line-height: 1.3;
  user-select: none;
}
.sticky-note::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 84px;
  width: 58px;
  height: 22px;
  background: #fffdf7a6;
  transform: rotate(2deg);
}
.sticky-note .note-label {
  font-size: 8px;
  letter-spacing: 1px;
  color: #756e66;
  margin-bottom: 4px;
}
.sticky-note b {
  color: #9e755f;
  margin-right: 5px;
  font-weight: 400;
}
.sticky-note i {
  font: italic 16px var(--serif);
  color: #927764;
  margin: 3px 0 0 22px;
}
.toy-cursor {
  position: absolute;
  left: 77%;
  top: 52%;
  pointer-events: none;
  z-index: 3;
  color: var(--ink);
}
.toy-cursor svg {
  fill: white;
  width: 25px;
  height: 25px;
  transform: rotate(-12deg);
}
.toy-cursor > span {
  position: absolute;
  top: 27px;
  left: 17px;
  background: var(--ink);
  border-radius: 3px;
  padding: 1px 8px;
  font-size: 9px;
  color: white;
}
.demo-cat {
  position: absolute;
  left: 62%;
  top: 70%;
  width: 34px;
  height: 34px;
  background-image: url("../Games/assets/oneko-thanksgiving.png");
  background-size: 272px 136px;
  background-position: -102px -102px;
  z-index: 4;
  padding: 0;
  background-color: transparent;
  cursor: grab;
  touch-action: none;
  image-rendering: pixelated;
}
.demo-cat:active {
  cursor: grabbing;
}
.demo-cat[hidden] {
  display: none;
}
.desktop-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 8px 15px;
  background: #ffffff4d;
  color: #62483d;
  font-size: 8px;
  user-select: none;
}
.pet-bed {
  position: absolute;
  bottom: 27px;
  right: 26px;
  width: 88px;
  height: 70px;
}
.pet-bed img {
  position: absolute;
  width: 88px;
  height: 70px;
  inset: 0;
  pointer-events: none;
}
.bed-back {
  z-index: 0;
}
.pet-bed .bed-cat {
  position: absolute;
  left: 24px;
  top: 6px;
  width: 34px;
  height: 34px;
  background-image: url("../Games/assets/oneko-thanksgiving.png");
  background-size: 272px 136px;
  background-position: -68px 0;
  z-index: 1;
  padding: 0;
  background-color: transparent;
  cursor: grab;
  touch-action: none;
}
.bed-front {
  z-index: 2;
}
.sleep-z {
  position: absolute;
  left: 45px;
  top: -10px;
  font: italic 16px var(--serif);
  color: #704f42;
  letter-spacing: 4px;
  opacity: 0;
}
.pet-bed.is-sleeping .bed-cat,
.pet-bed.is-sleeping .sleep-z {
  opacity: 1;
}
.play-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}
.play-controls p {
  font-size: 10px;
  max-width: 205px;
  line-height: 1.5;
}
.play-buttons {
  display: flex;
  align-items: center;
  gap: 8px;
}
.small-button,
.icon-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  background: white;
  border: 1px solid var(--line);
  border-radius: 6px;
  min-height: 44px;
  gap: 6px;
  transition: background 0.15s;
}
.small-button {
  font-size: 11px;
  padding: 8px 11px;
  white-space: nowrap;
}
.icon-button {
  width: 44px;
}
.small-button .icon,
.icon-button .icon {
  width: 15px;
  height: 15px;
}
.small-button:hover,
.icon-button:hover {
  background: #eeeff1;
}
.small-button[aria-pressed="true"],
.icon-button[aria-pressed="true"] {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
.demo-caption {
  font-size: 9px;
  margin-top: 12px;
  color: #696c72;
}
.manifesto-strip {
  border-block: 1px solid var(--line);
  padding-block: 19px;
}
.manifesto-strip > .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: #71747a;
  letter-spacing: 2px;
  gap: 15px;
}
.strip-last {
  display: flex;
  align-items: center;
  gap: 25px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 24px;
  font-style: italic;
  letter-spacing: -0.7px;
}
.sleep-sprite {
  background-position: -64px 0;
}
.personality {
  padding-block: 100px 90px;
}
.section-heading {
  position: relative;
  margin-bottom: 42px;
}
.section-heading h2,
.download-heading h2,
.faq-heading h2 {
  font-size: clamp(36px, 4vw, 54px);
  margin-top: 16px;
}
.section-heading > p:last-child {
  position: absolute;
  right: 0;
  bottom: 4px;
  font-size: 14px;
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.feature-art {
  height: 176px;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin-bottom: 23px;
}
.chase-art {
  background: #e9edf4;
}
.chase-art .sprite {
  position: absolute;
  left: 35%;
  top: 47%;
  transform: scale(2);
  background-position: -96px 0;
}
.chase-art > .icon {
  width: 36px;
  height: 36px;
  position: absolute;
  left: 72%;
  top: 30%;
  fill: white;
  transform: rotate(-12deg);
}
.dotted-trail {
  width: 95px;
  height: 51px;
  position: absolute;
  left: 8%;
  top: 52%;
  border: 2px dashed #b1bac8;
  border-bottom: 0;
  border-right: 0;
  border-radius: 50% 0 0 0;
  transform: rotate(-15deg);
}
.nap-art {
  background: var(--peach);
}
.mini-bed {
  position: absolute;
  left: calc(50% - 65px);
  top: 37px;
  width: 130px;
  height: 104px;
}
.mini-bed img {
  position: absolute;
  width: 130px;
  height: 104px;
  inset: 0;
}
.mini-bed .sprite {
  position: absolute;
  left: 37px;
  top: 28px;
  transform: scale(2);
}
.nap-art > span {
  position: absolute;
  top: 29px;
  left: 64%;
  font: italic 22px var(--serif);
  color: #825340;
  letter-spacing: 7px;
}
.company-art {
  background: var(--mint);
}
.tiny-window {
  position: absolute;
  width: 174px;
  height: 94px;
  background: #fffdf9;
  border: 1px solid #b4c9bb;
  border-radius: 7px;
  left: calc(50% - 90px);
  top: 40px;
  padding: 0 10px;
  box-shadow: 3px 5px 0 #cadbcf;
}
.tiny-window > i {
  display: inline-block;
  width: 4px;
  height: 4px;
  background: #b1c2b5;
  border-radius: 50%;
  margin-right: 3px;
  vertical-align: 8px;
}
.tiny-window > span {
  display: block;
  text-align: center;
  font: italic 15px var(--serif);
  padding-top: 13px;
  color: #58735f;
}
.company-art > .sprite {
  position: absolute;
  left: 70%;
  top: 59%;
  transform: scale(1.7);
}
.feature-number {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #797c80;
}
.feature h3 {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.5px;
  margin: 9px 0;
}
.feature p {
  font-size: 13px;
  line-height: 1.8;
  max-width: 330px;
}
.download-section {
  padding-block: 85px;
  background: #eceef1;
  border-block: 1px solid #e2e5e9;
}
.download-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 25px;
  margin-bottom: 38px;
}
.download-heading > p {
  font-size: 14px;
  line-height: 1.8;
}
.platform-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.platform-card {
  background: var(--paper);
  border: 1px solid #d9dde2;
  padding: 27px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
}
.windows-card {
  background: white;
  border-color: #e8b8ae;
}
.platform-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.platform-top > .icon {
  width: 27px;
  height: 27px;
}
.pill {
  font-size: 8px;
  font-weight: 650;
  letter-spacing: 1px;
  background: #fae9e3;
  color: #a7311d;
  padding: 5px 8px;
  border-radius: 4px;
  line-height: 1.5;
}
.pill.neutral {
  background: #e9ecef;
  color: #64686e;
}
.platform-card h3 {
  font-size: 28px;
  letter-spacing: -0.8px;
  font-weight: 600;
  margin: 24px 0 12px;
}
.platform-card > p:not([class]) {
  font-size: 13px;
  line-height: 1.8;
  flex: 1;
}
.platform-offer {
  font-size: 12px;
  font-weight: 650;
  color: var(--ink);
  margin: 30px 0 13px;
}
.platform-offer span {
  font-weight: 400;
  color: var(--muted);
}
.platform-card .button {
  width: 100%;
  font-size: 12px;
  justify-content: space-between;
}
.button.secondary {
  background: white;
  border: 1px solid #c9cdd3;
}
.button.secondary:hover {
  background: #e4e8ed;
}
.platform-card .coming-soon {
  justify-content: center;
  color: #5c626b;
  background: #e7e9ed;
  cursor: default;
}
.compatibility {
  font-size: 10px;
  margin-top: 13px;
  text-align: center;
}
.availability-note,
.store-direct {
  font-size: 10px;
  text-align: center;
  margin-top: 8px;
  line-height: 1.5;
  min-height: 25px;
}
.store-direct {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.store-note {
  font-size: 10px;
  margin-top: 23px;
  text-align: center;
}
.faq-section {
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  gap: 60px;
  padding-block: 100px;
}
.faq-heading .text-link {
  margin-top: 23px;
}
.faq-list {
  border-top: 1px solid var(--line);
}
details {
  border-bottom: 1px solid var(--line);
}
summary {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding-block: 23px;
  font-size: 14px;
  font-weight: 550;
}
summary::-webkit-details-marker {
  display: none;
}
summary > span {
  font-size: 23px;
  font-weight: 300;
  transition: transform 0.15s;
}
details[open] summary > span {
  transform: rotate(45deg);
}
details p {
  font-size: 13px;
  line-height: 1.85;
  padding: 0 28px 24px 0;
}
details a {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.closing {
  background: #f4e7e1;
  border: 1px solid #ecdad0;
  border-radius: 16px;
  padding: 40px 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  margin-bottom: 80px;
}
.closing-cat {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 72px;
}
.closing-cat > .sprite {
  transform: scale(2.5);
}
.closing > p {
  font-size: 38px;
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: -1.6px;
  flex: 1;
}
.closing-aside {
  font: italic 13px/1.4 var(--serif);
  color: #765846;
  transform: rotate(5deg);
}
.site-footer {
  padding-block: 30px 25px;
  border-top: 1px solid var(--line);
}
.footer-top {
  display: flex;
  align-items: center;
  gap: 30px;
}
.footer-top .wordmark {
  font-size: 26px;
}
.footer-top > p {
  font-size: 11px;
}
.footer-top nav {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 12px;
}
.footer-top nav a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  gap: 5px;
}
.footer-top nav a:hover {
  text-decoration: underline;
}
.footer-top .icon {
  width: 14px;
}
.footer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 9px;
  margin-top: 35px;
  color: #626975;
}
.footer-bottom a {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.editorial {
  max-width: 840px;
  padding-block: 45px 100px;
}
.back-link {
  font-size: 13px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}
.back-link:hover {
  color: var(--coral);
}
.editorial-heading {
  padding-block: 35px 42px;
  border-bottom: 1px solid var(--line);
}
.editorial h1 {
  font-size: clamp(44px, 6vw, 73px);
  margin-block: 20px;
}
.editorial h1 em {
  color: var(--coral);
}
.editorial-intro {
  font-size: 17px;
  max-width: 560px;
}
.editorial-body {
  max-width: 680px;
}
.editorial-body section {
  margin-top: 38px;
}
.editorial h2 {
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -0.5px;
  margin-bottom: 14px;
}
.editorial-body p {
  font-size: 15px;
  line-height: 1.9;
  margin-block: 12px;
}
.editorial-body a:not(.button) {
  color: var(--coral-hover);
  text-decoration: underline;
  text-underline-offset: 4px;
  overflow-wrap: anywhere;
}
.editorial-body strong {
  color: var(--ink);
  font-weight: 600;
}
.contact-block {
  padding: 30px;
  background: var(--peach);
  border-radius: 12px;
}
.contact-block h2 {
  margin-top: 12px;
}
.contact-block .button {
  margin-top: 10px;
}
.license-text {
  font:
    12px/1.8 ui-monospace,
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #eceef1;
  padding: 24px;
  border-radius: 8px;
}

    E: [

      [3, 1],
    ],
    W: [
      [4, 2],
      [4, 3],
    ],
    N: [
      [1, 2],
      [1, 3],
    ],
    S: [

      [7, 2],

      [0, 3],
    ],
    NW: [
      [1, 0],
      [1, 1],
    ],

      [5, 1],
      [5, 2],
    ],

      [5, 3],
      [6, 1],
